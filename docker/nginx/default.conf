# Reverse proxy untuk single-VM. TLS di-terminate di Cloudflare (edge),
# sehingga origin di sini cukup HTTP port 80. Jangan expose 3333 ke publik —
# hanya proxy yang bicara ke app:3333 via network internal `labnet`.
upstream app {
    server app:3333;
}

server {
    listen 80;
    server_name _;

    # Form upload max 5MB (lihat validasi `max:5120`) + overhead multipart.
    client_max_body_size 6M;

    # Healthcheck container tanpa lewat Laravel (untuk depends_on proxy).
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare mengirim X-Forwarded-Proto asli (https); teruskan apa adanya.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
