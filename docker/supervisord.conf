; LabDigitalFEB — supervisord programs
; Laravel dev server + queue worker run inside the single app container.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:laravel]
command=php artisan serve --host=0.0.0.0 --port=3333
directory=/var/www/html
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:queue]
command=php artisan queue:work --tries=1 --sleep=1
directory=/var/www/html
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true