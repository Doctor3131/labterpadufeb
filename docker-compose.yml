# LabDigitalFEB — Docker Compose (production base)
#   prod: docker compose --env-file .env.docker up -d --build
#   dev : docker compose --env-file .env.docker -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The app container runs `php artisan serve` + `php artisan queue:work`
# (supervisord), and connects to a MySQL 8 container. DB credentials are never
# hardcoded here — they come from .env.docker via fail-fast interpolation.
###############################################################################

name: labterpadu

services:
  app:
    build:
      context: .
      target: prod
    env_file:
      - .env.docker
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3333}:3333"
    networks:
      - labnet
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env.docker}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env.docker}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.docker}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_EXT_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - labnet
    restart: unless-stopped

volumes:
  db_data:
  storage:

networks:
  labnet:
    driver: bridge